<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CNeuroMod alignment QA</title>
<style>
/* ---- Tokens: light theme, then dark ---------------------------------- */
:root {
  color-scheme: light dark;
  --page: #f9f9f7; --surface: #fcfcfb; --raised: #f1f0ec;
  --ink: #0b0b0b; --ink2: #52514e; --muted: #7b7973;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11, 11, 11, .12);
  --quiet: #b5b4ab; --quiet2: #807e77;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
  --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948;
  --band: rgba(42, 120, 214, .10); --zone: rgba(227, 73, 72, .09);
  --pill: #fbd9cc; --pill-ink: #6b2408; --link: #1c5cab; --select: rgba(42, 120, 214, .12);
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #0d0d0d; --surface: #1a1a19; --raised: #252523;
    --ink: #f0efec; --ink2: #c3c2b7; --muted: #98968f;
    --grid: #2c2c2a; --axis: #45453f; --border: rgba(255, 255, 255, .14);
    --quiet: #4d4c47; --quiet2: #85837c;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
    --c5: #d55181; --c6: #0ca30c; --c7: #9085e9; --c8: #e66767;
    --band: rgba(57, 135, 229, .16); --zone: rgba(230, 103, 103, .13);
    --pill: #5a2610; --pill-ink: #ffd9c9; --link: #86b6ef; --select: rgba(57, 135, 229, .20);
  }
}

/* ---- Page ------------------------------------------------------------ */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; overflow-x: hidden; }
.page { max-width: 1320px; margin: 0 auto; padding: 20px 16px 60px; }
h1 { font-size: 24px; font-weight: 600; margin: 0 0 6px; }
h2 { font-size: 16px; font-weight: 600; margin: 0 0 10px; }
h3 { font-size: 14px; font-weight: 600; margin: 16px 0 6px; }
p { margin: 0 0 10px; max-width: 78ch; }
a { color: var(--link); }
.lede { color: var(--ink2); max-width: 86ch; }
.note { color: var(--ink2); font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; overflow-wrap: anywhere; }
#qa-errors { display: none; white-space: pre-wrap; padding: 10px; margin: 10px 0; border: 2px solid var(--c8);
  border-radius: 6px; background: var(--surface); }
#qa-errors.shown { display: block; }
:focus-visible { outline: 2px solid var(--c1); outline-offset: 2px; }

/* ---- Controls and tabs ----------------------------------------------- */
.controls { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; margin: 14px 0 6px; }
.controls label, .field label { color: var(--ink2); font-size: 13px; margin-right: 6px; }
select, button, input { font: inherit; color: inherit; }
select { background: var(--surface); border: 1px solid var(--axis); border-radius: 6px; padding: 4px 8px; max-width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--axis); border-radius: 6px; overflow: hidden; }
.seg button { background: var(--surface); border: 0; padding: 4px 12px; cursor: pointer; color: var(--ink2); }
.seg button + button { border-left: 1px solid var(--axis); }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--ink); font-weight: 600; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--axis); margin: 10px 0 16px; overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; cursor: pointer;
  color: var(--ink2); white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
.linkish { background: none; border: 0; padding: 0; color: var(--link); cursor: pointer; text-decoration: underline; }

/* ---- Cards and layout ------------------------------------------------ */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px;
  margin: 0 0 16px; min-width: 0; }
.split { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; align-items: start; }
.split > * { min-width: 0; }
.head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
.head h2 { margin: 0; }
.figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px 28px; align-items: start; margin-bottom: 6px; }
.figs figure { margin: 0; min-width: 0; overflow-x: auto; }
.figs figcaption { color: var(--ink2); font-size: 13px; max-width: 62ch; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; }
.tile b { display: block; font-size: 24px; font-weight: 600; }
.tile span { color: var(--ink2); font-size: 13px; }
.empty { padding: 26px 16px; text-align: center; color: var(--ink2); border: 1px dashed var(--axis); border-radius: 8px; }
dl.defs { display: grid; grid-template-columns: minmax(120px, max-content) minmax(0, 1fr); gap: 4px 16px; margin: 0 0 10px; font-size: 13px; }
dl.defs dt { font-weight: 600; }
dl.defs dd { margin: 0; color: var(--ink2); max-width: 90ch; }
details { margin-top: 8px; }
summary { cursor: pointer; font-weight: 600; }
.lines { margin: 0 0 10px; font-size: 13px; }
.lines div { margin-bottom: 3px; }
.lines span.k { color: var(--ink2); }
@media (max-width: 900px) { .split { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 560px) { dl.defs { grid-template-columns: minmax(0, 1fr); } dl.defs dt { margin-top: 6px; } .card { padding: 12px; } }

/* ---- Tables ---------------------------------------------------------- */
.scroll { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 5px 10px 5px 6px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { font-weight: 600; white-space: nowrap; border-bottom-color: var(--axis); }
th button { background: none; border: 0; padding: 0; font-weight: 600; cursor: pointer; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.pick { cursor: pointer; }
tr.pick:hover td { background: var(--raised); }
tr.sel td { background: var(--select); }
td.nowrap { white-space: nowrap; }
tr.dsnote td { color: var(--ink2); font-size: 12px; padding-top: 0; border-bottom-color: var(--grid); }
tr.nonote td { border-bottom-color: transparent; }
.cell { display: inline-block; min-width: 64px; text-align: center; border: 0; background: none; padding: 1px 8px;
  border-radius: 10px; cursor: pointer; font-variant-numeric: tabular-nums; color: var(--muted); }
.cell.hit { background: var(--pill); color: var(--pill-ink); font-weight: 600; }
.cell.na { cursor: help; }
.icon { width: 16px; height: 16px; vertical-align: -3px; stroke: currentColor; fill: none; stroke-width: 1.6; }
.icon.doc { color: var(--c6); }

/* ---- Charts ---------------------------------------------------------- */
.chart { display: block; max-width: 100%; touch-action: pan-y; }
.chart text { font: 11px system-ui, sans-serif; fill: var(--muted); }
.chart text.title { fill: var(--ink2); font-size: 12px; }
.chart text.row { fill: var(--ink); font-size: 12px; }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .axis { stroke: var(--axis); stroke-width: 1; }
.chart .rule { stroke: var(--ink2); stroke-width: 1; stroke-dasharray: 4 3; }
.chart .bandfill { fill: var(--band); }
.chart .zone { fill: var(--zone); }
.chart .dot { fill: var(--k); stroke: var(--surface); stroke-width: .6; }
.chart .dot.big { stroke-width: 1.2; }
.chart .ln { fill: none; stroke: var(--k); stroke-width: 2; stroke-linejoin: round; }
.chart .ln.faint { stroke-width: 1.2; opacity: .55; stroke-dasharray: 5 3; }
.chart .ring { fill: none; stroke: var(--ink); stroke-width: 2; pointer-events: none; }
.chart .cross { stroke: var(--ink2); stroke-width: 1; pointer-events: none; }
.chart .typ { fill: var(--quiet); opacity: .45; }
.chart .typline { stroke: var(--quiet2); stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
.k1 { --k: var(--c1); } .k2 { --k: var(--c2); } .k3 { --k: var(--c3); } .k4 { --k: var(--c4); }
.k5 { --k: var(--c5); } .k6 { --k: var(--c6); } .k7 { --k: var(--c7); } .k8 { --k: var(--c8); }
.kq { --k: var(--quiet); } .kq2 { --k: var(--quiet2); } .kink { --k: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 6px; margin: 6px 0; }
.legend button, .legend span.item { display: inline-flex; align-items: center; gap: 6px; background: none; border: 1px solid transparent;
  border-radius: 12px; padding: 1px 8px; font-size: 12px; color: var(--ink2); }
.legend button { cursor: pointer; }
.legend button:hover { border-color: var(--axis); }
.legend button[aria-pressed="false"] { opacity: .4; text-decoration: line-through; }
.legend b { color: var(--ink); font-variant-numeric: tabular-nums; }
.sw { width: 12px; height: 12px; flex: none; }
.sw .dot { fill: var(--k); }
.sw .ln { stroke: var(--k); stroke-width: 2.5; }
#tip { position: fixed; z-index: 10; pointer-events: none; display: none; max-width: min(380px, 92vw); background: var(--surface);
  color: var(--ink); border: 1px solid var(--axis); border-radius: 8px; padding: 8px 10px; font-size: 12px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, .18); }
#tip b.t { display: block; margin-bottom: 2px; }
#tip table { font-size: 12px; margin-top: 4px; }
#tip td, #tip th { padding: 1px 8px 1px 0; border: 0; }
#tip .off { color: var(--muted); }

/* ---- Schematics (Methods figures) ------------------------------------ */
.sk { display: block; width: 100%; height: auto; }
.sk text { font: 12px system-ui, sans-serif; fill: var(--ink); }
.sk text.m { fill: var(--ink2); }
.sk text.s { font-size: 11px; fill: var(--ink2); }
.sk .l { fill: none; stroke: var(--ink); stroke-width: 1.6; }
.sk .t { fill: none; stroke: var(--axis); stroke-width: 1.2; }
.sk .d { stroke-dasharray: 5 4; }
.sk .a { stroke: var(--c1); } .sk .b { stroke: var(--c2); }
.sk .fa { fill: var(--c1); } .sk .fb { fill: var(--c2); } .sk .fq { fill: var(--quiet); } .sk .fi { fill: var(--ink); }
.sk .box { fill: var(--raised); stroke: var(--axis); }
.sk .own { fill: none; stroke: var(--ink); stroke-width: 2; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" style="fill:var(--ink)"/></marker>
</defs></svg>

<div class="page">
  <pre id="qa-errors" role="alert"></pre>
  <h1>CNeuroMod alignment QA</h1>
  <p class="lede" id="lede"></p>
  <div class="controls">
    <span><label for="ds-menu">Dataset</label><select id="ds-menu"></select></span>
    <span><label id="colour-label">Colour the charts by</label><span class="seg" role="group" aria-labelledby="colour-label">
      <button type="button" data-colour="result">Result</button><button type="button" data-colour="dataset">Dataset</button></span></span>
  </div>
  <div class="tabs" role="tablist" aria-label="Checks" id="tabs"></div>
  <main id="view" role="tabpanel" tabindex="-1"></main>
</div>
<div id="tip" role="status"></div>

<!-- ==== Methods: static figures and wording, one template per tab. ====
     <span data-rule="name"> is filled from meta.rules (data-as="pct" shows a share as a percentage). -->

<template id="m-overview">
  <div class="figs"><figure>
    <svg class="sk" viewBox="0 0 520 132" style="max-width:640px;min-width:470px" role="img" aria-label="From the events file to a result: predictors, shift scan, vote">
      <rect class="box" x="1" y="20" width="112" height="92" rx="8"/><text x="10" y="40" font-weight="600">Events file</text>
      <text class="s" x="10" y="58">onsets, durations,</text><text class="s" x="10" y="72">responses; game</text><text class="s" x="10" y="86">recordings; other</text><text class="s" x="10" y="100">subjects' BOLD</text>
      <path class="l" d="M116 66H132" marker-end="url(#arr)"/>
      <rect class="box" x="136" y="20" width="112" height="92" rx="8"/><text x="145" y="40" font-weight="600">Predictors</text>
      <text class="s" x="145" y="58">each one a signal</text><text class="s" x="145" y="72">expected in the</text><text class="s" x="145" y="86">brain, convolved</text><text class="s" x="145" y="100">with an HRF</text>
      <path class="l" d="M251 66H267" marker-end="url(#arr)"/>
      <rect class="box" x="271" y="20" width="112" height="92" rx="8"/><text x="280" y="40" font-weight="600">Shift scan</text>
      <text class="s" x="280" y="58">each predictor slid</text><text class="s" x="280" y="72">along the run's</text><text class="s" x="280" y="86">BOLD: best shift</text><text class="s" x="280" y="100">and fit</text>
      <path class="l" d="M386 66H402" marker-end="url(#arr)"/>
      <rect class="box" x="406" y="20" width="112" height="92" rx="8"/><text x="415" y="40" font-weight="600">Vote</text>
      <text class="s" x="415" y="58">the predictors</text><text class="s" x="415" y="72">that are reliable</text><text class="s" x="415" y="86">for the task give</text><text class="s" x="415" y="100">the run's result</text>
    </svg></figure></div>
  <p>Every check asks the same question: do the signals expected in the brain line up with this run's BOLD? The expected signals (the predictors) come from the run's events file, from the game recordings and from the other subjects who received the same stimulus. Each one is slid along the run's parcel time series to find the shift where it fits best; the checks then read those fits.</p>
  <p>Start shift asks whether the BOLD started with the events, Pairing whether the events belong to this run, End of run whether both end together, Drift whether the timing holds along the run, and Repetitions (videogames) whether each play points at its own replay. Coverage lists what could not be checked.</p>
  <p>A predictor only votes for a task when it is reliable there, and the result of a run always comes from all its reliable predictors together.</p>
</template>

<template id="m-predictors">
  <dl class="defs">
    <dt>Stimulus on/off</dt><dd>1 while a stimulus is shown or played, 0 otherwise ("game on/off" in the videogame datasets: 1 while a game is played, 0 between plays). Code: stim.</dd>
    <dt>Button presses</dt><dd>A brief pulse at each response; in the videogame datasets, how many buttons go down on each frame of the game recording. Code: resp.</dd>
    <dt>Other subjects</dt><dd>The mean BOLD of the other subjects for the same stimulus, parcel by parcel. It needs no events file, and it only exists where every subject received the same stimulus. Code: isc.</dd>
    <dt>Conditions</dt><dd>The same on/off signal for each of the three conditions that cover the most time; the tables name the condition. Codes: cond1, cond2, cond3.</dd>
    <dt>Screen luminance</dt><dd>Mean luminance of each frame of the game recording, with its in-game mean removed. Code: luminance.</dd>
    <dt>Optical flow</dt><dd>Amount of motion on screen in each frame of the game recording. Code: flow.</dd>
    <dt>Audio envelope</dt><dd>Loudness of the game sound in each frame of the game recording. Code: audio.</dd>
  </dl>
  <p class="note">A predictor only votes for a task when it is reliable there: at least <span data-rule="concentration_min" data-as="pct"></span> of the task's runs agree on the same best shift (within <span data-rule="shift_min_vols"></span> volumes), over at least <span data-rule="reliable_min_runs"></span> runs. A recording-based predictor is used for a run when it covers at least <span data-rule="availability_min" data-as="pct"></span> of the play time. The Reference table of the Start shift tab lists every predictor of every task with its agreement.</p>
</template>

<template id="m-shift">
  <div class="figs">
    <figure>
      <svg class="sk" viewBox="0 0 460 306" style="max-width:460px" role="img" aria-label="The events become a predicted signal, which is slid along the measured signal; the correlation at each shift gives the fit by shift curve">
        <text x="0" y="22">Events</text><text class="m" x="0" y="38">stimulus on/off</text>
        <path class="l" d="M110 42H130V14H210V42H222V14H300V42H312V14H420V42H440"/>
        <path class="l" d="M50 50V72" marker-end="url(#arr)"/><text class="m" x="60" y="66">convolved with an HRF</text>
        <text x="0" y="98">Prediction</text><text class="m" x="0" y="114">predicted BOLD</text>
        <path class="l" d="M110 116C135 116 135 88 160 88H215C222 88 222 96 229 96C236 96 236 88 243 88H305C312 88 312 96 319 96C326 96 326 88 333 88H425C440 88 440 116 455 116"/>
        <path class="l" d="M118 140H156" marker-start="url(#arr)" marker-end="url(#arr)"/><text class="m" x="166" y="144">slide the prediction along the measured signal</text>
        <text x="0" y="172">Measured</text><text class="m" x="0" y="188">parcels that follow it</text>
        <path class="l a d" d="M110 190C135 190 135 162 160 162H215C222 162 222 170 229 170C236 170 236 162 243 162H305C312 162 312 170 319 170C326 170 326 162 333 162H425"/>
        <path class="l" style="stroke:var(--ink2)" d="M110 192l8-2 8 3 8-2c22-3 22-27 44-29l9 2 9-3 9 2 9-2 9 3 9-2c7 1 7 8 14 8s7-8 14-9l9 2 9-3 9 2 9-2 9 3 9-2c7 1 7 8 14 8s7-8 14-9l9 2 9-3 9 2 9-2 9 3 9-2 9 2"/>
        <text x="0" y="238">Fit by shift</text><text class="m" x="0" y="254">correlation r</text>
        <path class="t" d="M110 288H455"/><path class="t" d="M250 216V288"/>
        <path class="l" d="M110 283C200 281 250 273 270 243C285 218 300 218 315 243C335 275 380 281 455 283"/>
        <circle cx="250" cy="266" r="4" style="fill:var(--surface);stroke:var(--ink);stroke-width:1.6"/><circle class="fi" cx="292.5" cy="224" r="4"/>
        <path class="l" d="M252 208H289" marker-end="url(#arr)"/><text x="232" y="202">predictor shift</text>
        <path class="t d" d="M256 266H344M298 224H344"/><path class="l" d="M338 262V229" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="348" y="250">gain</text>
        <text class="m" x="250" y="302" text-anchor="middle">usual shift</text><text class="m" x="455" y="302" text-anchor="end">shift of the events →</text>
      </svg>
      <figcaption><b>Predictor shift.</b> The events of a run become a predicted BOLD signal (dashed: the prediction where the events put it). It is slid along the measured signal of the parcels that follow that predictor best in the subject's other runs, and the correlation is computed at each shift. The shift where they match best, counted from the usual best shift of the task, is the predictor shift. The gain is how much better the fit is there than at the usual shift.</figcaption>
    </figure>
    <figure>
      <svg class="sk" viewBox="0 0 440 250" style="max-width:440px" role="img" aria-label="Two clocks: the scanner's first volume and the task clock's t=0; within a session their offset is the same for every run unless one run started early or late">
        <text class="m" x="0" y="14">One run</text>
        <text x="0" y="52">Scanner</text><text class="m" x="110" y="28">volume 1: acquisition time</text>
        <path class="l" d="M110 48H430M110 40V56M140 43V53M170 43V53M200 43V53M230 43V53M260 43V53M290 43V53M320 43V53M350 43V53M380 43V53M410 43V53"/>
        <path class="t d" d="M110 56V92"/><text class="m" x="120" y="76">same instant</text><text class="m" x="430" y="76" text-anchor="end">d = acquisition time − t0</text>
        <text x="0" y="100">Task clock</text><path class="t" d="M80 96H430"/><path class="l" d="M110 86V106"/>
        <text class="m" x="110" y="124">t = 0 of the events on the task's own clock</text>
        <text class="m" x="0" y="160">One session</text><text class="m" x="0" y="176">d of each run</text>
        <text class="m" x="122" y="182">session median</text><path class="t" d="M120 190H430"/>
        <circle class="fi" cx="170" cy="190" r="4.5"/><circle class="fb" cx="250" cy="222" r="4.5"/><circle class="fi" cx="330" cy="191" r="4.5"/><circle class="fi" cx="410" cy="189" r="4.5"/>
        <path class="l" d="M268 194V219" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="278" y="212">N × TR</text>
        <text class="s" x="170" y="246" text-anchor="middle">run A</text><text class="s" x="250" y="246" text-anchor="middle">run B</text><text class="s" x="330" y="246" text-anchor="middle">run C</text><text class="s" x="410" y="246" text-anchor="middle">run D</text>
      </svg>
      <figcaption><b>Clock shift.</b> In a normal run, volume 1 and the events' t=0 happen at the same instant, so d only measures the offset between the two computers' clocks: it is the same for every run of a session. A run whose d sits N × TR away from the session median started its BOLD N volumes before or after t=0. Only events files that keep the task's own clock give a clock shift, and it needs at least three such runs in the session.</figcaption>
    </figure>
  </div>
  <p><b>Combined result.</b> A predictor only votes for a task when it is reliable there. The result of a run always comes from all its reliable predictors together, because a real shift moves nearly all of them; the combined shift is the median of the predictors that back the result. A shift counts from <span data-rule="shift_min_vols"></span> volumes and is flagged when the predictors converge on at least <span data-rule="shift_flag_vols"></span> volumes. When the clocks show a shift, one predictor that finds the same shift confirms it. The menus next to the charts only change which predictor's curve is displayed.</p>
  <p><b>Periodic designs.</b> When trials repeat at a fixed pace, a shift of a whole number of trials fits as well as the right one. Runs whose best shift lands on such an alias are not flagged; the Reference lists the aliases of each predictor.</p>
</template>

<template id="m-pair">
  <div class="figs"><figure>
    <svg class="sk" viewBox="0 0 460 180" style="max-width:460px" role="img" aria-label="Matrix of BOLD runs against events files: each run should fit its own events best; runs 2 and 3 fit each other's events">
      <text class="s" x="131" y="14" text-anchor="middle">events 1</text><text class="s" x="171" y="14" text-anchor="middle">2</text><text class="s" x="211" y="14" text-anchor="middle">3</text><text class="s" x="251" y="14" text-anchor="middle">4</text>

  <p><b>What it means.</b> Events past the end are not an error by themselves, but the end of the last event has no BOLD to model. A long tail is usually a scan stopped late; it can also mean that events are missing from the file. A run much shorter than the other runs of the same stimulus was probably interrupted.</p>

  <p><b>Score.</b> For each predictor, a line is fitted to the window shifts (weighted by the fit of each window); its slope is in volumes per 10 minutes. Slopes are standardised per task and predictor and averaged over the reliable predictors: the drift score.</p>
  <p><b>Flag.</b> A run is flagged when the score reaches ±<span data-rule="drift_z"></span>, its predictors (all but one at most) slope the same way, and the mean slope is at least <span data-rule="slope_min"></span> volumes per 10 minutes. The result always combines all reliable predictors; the predictor menu only changes which curve is in front.</p>
  <p><b>Validation.</b> In a sample of runs, the events of the second half were moved by <span data-rule="simulated_vols"></span> volumes (a jump), or moved progressively by the same amount over the run (a drift). The Reference gives the share caught, and the share of unchanged runs that the rule flags: flagged runs are candidates to look at, not proof of a drift.</p>

    <figcaption><b>Slot.</b> In the events, a play's slot runs from its onset to the next play's. Its replay (frames ÷ frame rate) fills it, followed by the session's usual gap. A replay that belongs to another play of the same level is usually longer or shorter than the slot.</figcaption>
  </figure></div>
  <p><b>Candidates.</b> For each play, the replays of every other play of the same level in the same session are the candidates that could have been mixed up with its own.</p>
  <p><b>Slot.</b> The slot deviation is the slot minus the replay's length minus the session's usual gap. A play is flagged when its own replay misses its slot by more than <span data-rule="slot_tolerance_s"></span> s. Two plays whose replays each fill the other's slot are reported as swapped. When most plays of a session miss their slot, the session has irregular gaps, and its plays are noted quietly. The last play of a run has no slot.</p>
  <p><b>Brain.</b> Replays of the same length cannot be told apart by the slot. Inside the run, only this play's part of each predictor (button presses, screen luminance, optical flow, audio envelope) is replaced by the candidate's, and the fit with the BOLD is compared with the fit of the play's own replay. A candidate that fills the slot is preferred when the median standardised gain reaches <span data-rule="replay_z"></span>, all predictors but one at most improve, and button presses do not get worse. A play is a small part of a run, so this evidence is weak.</p>
  <p><b>Validation.</b> Every play is given, in simulation, each other replay of its level in the session; the Reference gives the share of these swaps that is caught.</p>

<script id="qa-data" type="application/json">__QA_ALIGN_DATA__</script>
<script>
'use strict';

/* ---- 0. Runtime errors are written into the page ----------------------- */
function reportError(message) {
  const box = document.getElementById('qa-errors');
  box.classList.add('shown');
  box.textContent += message + '\n';
}
window.onerror = (message, source, line, column) => reportError(`${message} (line ${line}:${column})`);
window.addEventListener('unhandledrejection', event => reportError(String(event.reason)));

/* ---- 1. DOM and formatting helpers -------------------------------------- */
const SVG_NS = 'http://www.w3.org/2000/svg';
const $ = (selector, root = document) => root.querySelector(selector);

function setAttrs(node, attrs) {
  for (const [name, value] of Object.entries(attrs || {})) {
    if (value === null || value === undefined || value === false) continue;
    if (name.startsWith('on')) node.addEventListener(name.slice(2), value);
    else node.setAttribute(name, value === true ? '' : value);
  }
}
function append(node, children) {
  for (const child of children.flat(Infinity)) {
    if (child === null || child === undefined || child === false || child === '') continue;
    node.append(child.nodeType ? child : document.createTextNode(String(child)));
  }
  return node;
}
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  setAttrs(node, attrs);
  return append(node, children);
}
function S(tag, attrs, ...children) {
  const node = document.createElementNS(SVG_NS, tag);
  setAttrs(node, attrs);
  return append(node, children);
}
const has = value => value !== null && value !== undefined;
const fmt = (value, digits = 1) => has(value) ? Number(value).toFixed(digits).replace('-', '−') : '';
const signed = (value, digits = 1) => has(value) ? (value > 0 ? '+' : '') + fmt(value, digits) : '';
const percent = value => has(value) ? `${+Number(value).toFixed(1)}%` : 'n/a';
const count = value => Number(value).toLocaleString('en-US');
const plural = (n, word) => `${count(n)} ${word}${n === 1 ? '' : 's'}`;
const median = values => {
  const sorted = values.slice().sort((a, b) => a - b), mid = sorted.length >> 1;
  return sorted.length ? (sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2) : null;
};
const mean = values => values.length ? values.reduce((sum, v) => sum + v, 0) / values.length : null;
const clamp = (value, lo, hi) => Math.min(hi, Math.max(lo, value));
const peak = values => values.reduce((most, v) => Math.max(most, Math.abs(v)), 0);
/** The size that 97% of the values stay under: a frame that a few extreme runs do not stretch. */
const usualPeak = values => {
  const sizes = values.map(Math.abs).sort((a, b) => a - b);
  return sizes.length ? sizes[Math.floor((sizes.length - 1) * .97)] : 0;
};

/** A stable number in [-1, 1] from a string, to spread dots that would overlap. */
function jitter(text) {
  let hash = 2166136261;
  for (let i = 0; i < text.length; i++) hash = Math.imul(hash ^ text.charCodeAt(i), 16777619);
  return ((hash >>> 0) % 2001) / 1000 - 1;
}
/** Calls `handler` at most once per animation frame, with the latest event. */
function throttled(handler) {
  let pending = null;
  return event => {
    const idle = pending === null;
    pending = event;
    if (idle) requestAnimationFrame(() => { const latest = pending; pending = null; handler(latest); });
  };
}

/* ---- 2. Data and indexes (built once) ------------------------------------ */
const DATA = JSON.parse($('#qa-data').textContent);
const MISSING = -128;                 // int8 value of a missing sample in the encoded series
const RULES = new Map(DATA.meta.rules.map(entry => [entry.name, entry]));
const rule = name => RULES.has(name) ? RULES.get(name).value : NaN;
const OVERVIEW = new Map(DATA.overview.map(row => [row.dataset, row]));
const DATASETS = DATA.overview.map(row => row.dataset);
const RUN = new Map(), RUNS_BY_DS = new Map(DATASETS.map(name => [name, []]));
for (const run of DATA.runs) {
  run.key = `${run.ds}|${run.id}`;
  RUN.set(run.key, run);
  if (!RUNS_BY_DS.has(run.ds)) RUNS_BY_DS.set(run.ds, []);
  RUNS_BY_DS.get(run.ds).push(run);
}
const PRED = new Map(DATA.predictors.map(row => [`${row.dataset}|${row.task}|${row.pred}`, row]));
const FINDING = new Map(DATA.findings.map(row => [`${row.check}|${row.dataset}|${row.run}`, row]));
const PLAY = new Map();
for (const [dataset, reps] of Object.entries(DATA.reps)) {
  for (const play of reps.plays) {
    play.ds = dataset;
    play.key = `${dataset}|${play.id}`;
    play.flag = play.flag || 'fits';
    PLAY.set(play.key, play);
  }
}
const isGame = dataset => (OVERVIEW.get(dataset) || {}).kind === 'videogame';
/** Repetition time of a dataset, from the spacing of its drift windows. */
const trOf = dataset => {
  const drift = DATA.drift[dataset];
  return drift && drift.dt_s ? drift.dt_s / rule('drift_step_vols') : 1.49;
};
function decode(base64) {
  const binary = atob(base64), values = new Int8Array(binary.length);
  for (let i = 0; i < binary.length; i++) values[i] = binary.charCodeAt(i);
  return values;
}
const MARGINS = new Map();            // dataset -> Map(run id -> {predictor: margin row}), built on demand
function marginsOf(dataset) {
  if (!MARGINS.has(dataset)) {
    const byRun = new Map();
    for (const row of (DATA.pairing[dataset] || {}).margins || []) {
      if (!byRun.has(row.id)) byRun.set(row.id, {});
      byRun.get(row.id)[row.pred] = row;
    }
    MARGINS.set(dataset, byRun);
  }
  return MARGINS.get(dataset);
}

/* ---- 3. Predictors, results and colours ----------------------------------- */
const PRED_ORDER = ['stim', 'resp', 'isc', 'cond1', 'cond2', 'cond3', 'luminance', 'flow', 'audio'];
// conditions (tasks) and recording features (videogames) never meet in one run: they share three colours
const PRED_CLASS = {stim: 'k1', resp: 'k2', isc: 'k3', cond1: 'k4', cond2: 'k5', cond3: 'k6',

function predName(pred, dataset, task) {
  if (pred === 'stim' && isGame(dataset)) return 'game on/off';
  const row = PRED.get(`${dataset}|${task}|${pred}`);
  const name = DATA.meta.predictor_names[pred] || pred;
  return row && row.label ? `${name} (${row.label})` : name;
}
const predsOf = run => PRED_ORDER.filter(pred => run.p && run.p[pred]);
const isReliable = (run, pred) => (PRED.get(`${run.ds}|${run.task}|${pred}`) || {}).reliable === true;
const reliablePreds = run => predsOf(run).filter(pred => isReliable(run, pred));

/* Every result a check can give: [value, colour class, meaning]. Classes kq/kq2 are the quiet,
   unflagged results; any other class is a flagged result and keeps its colour on every tab. */
const CHECKS = {
  shift: {label: 'Start shift', field: 'fs', flags: [
    ['shift: clock + brain', 'k2', 'The clocks show a shift and at least one predictor finds the same shift.'],
    ['shift: most predictors', 'k1', 'Three or more predictors, all but one at most, find the same shift.'],
    ['shift: both predictors', 'k3', 'The run has two predictors that count, and both find the same shift.'],
    ['shift: one predictor', 'k4', 'The run has one predictor that counts; it finds a shift with a clear gain in fit.'],
    ['shift: clock only', 'k7', 'The clocks show a shift that the brain signal cannot confirm.'],
    ['clocks and brain disagree', 'k5', 'The clocks and the predictors both see a shift, of different sizes.'],
    ['no fit to its stimulus', 'k8', 'Every predictor fits far below its usual fit: the events may belong to another run.'],
    ['aligned', 'kq', 'No shift.'],
    ['aligned (shift in few predictors)', 'kq2', 'Only a minority of the predictors see a shift: noted, not flagged.'],
    ['aligned (periodic design)', 'kq2', 'The best shift is a whole number of trials away: an alias of the design, not a shift.'],
    ['aligned (weak brain signal)', 'kq2', 'No predictor that counts fits well enough to judge the run.']]},
  pair: {label: 'Pairing', field: 'fp', flags: [
    ['events fit another run better', 'k2', 'The predictors together prefer the events of another run, and agree on which one.'],
    ['fits its own events', 'kq', 'The run fits its own events at least as well as any other.']]},
  end: {label: 'End of run', field: 'fe', flags: [
    ['events past the BOLD end', 'k8', 'The events end more than 2 volumes after the BOLD.'],
    ['cut at the volume limit', 'k7', 'The events go on after the BOLD, which stopped at the longest run length of the dataset, where several runs stop.'],
    ['run shorter than the others of its stimulus', 'k1', 'The run has far fewer volumes than the other runs of the same stimulus.'],
    ['unusual tail for the task', 'k4', 'The tail is unlike the tails of the other runs of the task.'],
    ['ok', 'kq', 'The run ends like the other runs of its task.'],
    ['ok (task version)', 'kq2', 'An unusual tail shared by several events files of the task: a version of the task, not an error.'],
    ['no events end', 'kq2', 'The events file has no content, so the tail cannot be measured.']]},
  drift: {label: 'Drift', field: 'fd', flags: [
    ['drift or jump', 'k2', 'The shift changes along the run, and the predictors agree on the direction.'],
    ['steady', 'kq', 'The shift stays the same from the start of the run to its end.']]},
  reps: {label: 'Repetitions', field: 'flag', flags: [
    ['replay does not fit its slot', 'k8', 'The replay is longer or shorter than the slot of the play in the events.'],
    ['another replay fits the brain better', 'k1', 'Another replay of the same level fills the slot as well and fits the brain better.'],
    ['replays swapped between two plays', 'k7', 'Two plays whose replays each fill the slot of the other.'],
    ['irregular gaps in the whole session', 'kq2', 'Most plays of the session miss their slot: the gaps are irregular, the replays are not misattributed.'],
    ['fits', 'kq', 'The replay fills its slot.']]},
};
const STYLE = {};
for (const [key, check] of Object.entries(CHECKS)) {
  STYLE[key] = new Map(check.flags.map(([value, cls, text]) => [value, {cls, text, flagged: !cls.startsWith('kq')}]));
}
const styleOf = (checkKey, value) => STYLE[checkKey].get(value) || {cls: 'kq2', text: '', flagged: false};
const isFlagged = (checkKey, row) => styleOf(checkKey, row[CHECKS[checkKey].field]).flagged;
const findingOf = (checkKey, row) => FINDING.get(`${CHECKS[checkKey].label}|${row.ds}|${row.id}`);

// 8 hues x 3 shapes give every dataset its own mark; the hue alone never carries the identity
const SHAPES = ['circle', 'square', 'diamond'];
const DS_STYLE = new Map(DATASETS.map((name, i) => [name, {cls: `k${i % 8 + 1}`, shape: SHAPES[Math.floor(i / 8) % 3]}]));

/* ---- 4. State, URL hash and selection ------------------------------------- */
const TABS = [['overview', 'Overview'], ['shift', 'Start shift'], ['pair', 'Pairing'], ['end', 'End of run'],
              ['drift', 'Drift'], ['reps', 'Repetitions'], ['coverage', 'Coverage']];
const state = {tab: 'overview', ds: '', colour: 'result', run: '', play: '', pred: 'all'};
const ui = {mode: {}, sort: {}, limit: {}, hidden: {}, filter: {check: '', status: ''}};
let view = null;                      // what the visible tab needs to redraw or update
let lastHash = '';

function readHash() {
  const query = new URLSearchParams(location.hash.slice(1));

    has(deviation) ? (Math.abs(deviation) <= tolerance ? 'yes' : 'no') : '', signed(evidence, 2)]);
  body.append(simpleTable([{label: 'Other replay'}, {label: 'Slot dev., s', num: true}, {label: 'Fills the slot'}, {label: 'Brain, z', num: true}], rows),
    el('p', {class: 'note'}, `Each row is the replay of another play of the same level in the session, put in this play's slot. Slot deviation (dev.): how far it is from filling the slot. Brain: how much better it fits the brain than the play's own replay (median standardised gain; ${rule('replay_z')} or more is needed, from a replay that fills the slot).`));
}
function repsReference(datasets) {
  const rows = datasets.map(dataset => {
    const {stats, sim} = DATA.reps[dataset];
    return [dataset, count(stats.plays), count(stats.with_cand), signed(stats.p1, 2), signed(stats.p99, 2), count(sim.n_swaps),
            percent(sim.caught), percent(sim.by_slot), percent(sim.brain_when_same_length), percent(sim.brain_false_alarm)];
  });
  return card(el('h2', {}, 'Reference'),
    el('p', {class: 'note'}, 'Per dataset: plays, plays with at least one other replay of their level in the session, the spread of the slot deviation of the plays that fit (1st to 99th percentile, seconds), and the simulated swaps between replays of the same level: how many are caught in total, by the slot alone, and by the brain when both replays have the same length. The last column is the share of plays for which the brain rule prefers another replay as they are.'),
    simpleTable([{label: 'Dataset'}, {label: 'Plays', num: true}, {label: 'With other replays', num: true}, {label: 'Slot deviation, 1st pct', num: true},
                 {label: '99th pct', num: true}, {label: 'Simulated swaps', num: true}, {label: 'Caught', num: true}, {label: 'By the slot', num: true},
                 {label: 'By the brain, same length', num: true}, {label: 'Brain rule on unchanged plays', num: true}], rows));
}

/* ---- 14. Overview ----------------------------------------------------------------------- */
const TAB_OF_CHECK = {'Start shift': 'shift', 'Pairing': 'pair', 'End of run': 'end', 'Drift': 'drift', 'Repetitions': 'reps', 'Coverage': 'coverage'};
function renderOverview(host) {
  view = newView('run');
  const rows = DATA.overview.filter(row => !state.ds || row.dataset === state.ds);
  const found = DATA.findings.filter(row => (!state.ds || row.dataset === state.ds) && row.check !== 'Coverage');
  const total = key => rows.reduce((sum, row) => sum + (row[key] || 0), 0);
  const tile = (value, label) => el('div', {class: 'tile'}, el('b', {class: 'num'}, count(value)), el('span', {}, label));
  host.append(el('div', {class: 'tiles'}, tile(total('runs'), state.ds ? `runs in ${state.ds}` : `runs in ${rows.length} datasets`),
    tile(total('with_series'), 'runs with parcel time series'), tile(found.length, 'findings to look at'),
    tile(found.filter(row => row.status !== 'documented').length, 'of which new, to check'), tile(total('coverage'), 'runs not checked in full')));
  host.append(card(el('h2', {}, 'Methods'), fromTemplate('m-overview'), predictorsBlock(false)), matrixCard(), findingsCard());
}
function matrixCell(row, key) {
  const label = key === 'coverage' ? 'Coverage' : CHECKS[key].label, reason = key === 'coverage' ? null : whyNot(key, row.dataset);
  if (reason) return el('span', {class: 'cell na', title: reason, tabindex: 0, 'aria-label': `${label} not available: ${reason}`}, 'n/a');
  const flagged = key === 'coverage' ? row.coverage : row[key], checked = key === 'coverage' ? row.runs : row[`checked_${key}`];
  const unit = key === 'reps' ? 'plays' : 'runs';
  const title = key === 'coverage' ? `${count(flagged)} of ${count(checked)} runs could not be checked in full`
                                   : `${count(flagged)} flagged of ${count(checked)} ${unit} judged`;
  return el('button', {type: 'button', class: `cell${flagged ? ' hit' : ''}`, title: `${title}. Open ${label} for ${row.dataset}.`,
                       onclick: () => go({tab: key, ds: row.dataset})}, `${count(flagged)} / ${count(checked)}`);
}
function matrixCard() {
  const keys = ['shift', 'pair', 'end', 'drift', 'reps', 'coverage'];
  const head = ['Dataset', 'Runs', 'With time series', 'BIDS commit', 'Predictors that count']
    .concat(keys.map(key => key === 'coverage' ? 'Coverage' : CHECKS[key].label));
  const body = el('tbody');
  for (const row of DATA.overview) {
    const chosen = state.ds === row.dataset;
    const predictors = isGame(row.dataset) ? row.predictors.replace('stimulus on/off', 'game on/off') : row.predictors;
    body.append(el('tr', {class: [chosen ? 'sel' : '', row.note ? 'nonote' : ''].join(' ').trim() || null},
      el('td', {class: 'nowrap'}, el('button', {type: 'button', class: 'linkish', 'aria-pressed': String(chosen),
        onclick: () => go({ds: chosen ? '' : row.dataset})}, row.dataset), el('div', {class: 'note'}, row.kind)),
      el('td', {class: 'r'}, count(row.runs)), el('td', {class: 'r'}, count(row.with_series)),
      el('td', {class: 'mono'}, (row.bids_commit || '').slice(0, 7)), el('td', {}, predictors || 'none'),
      keys.map(key => el('td', {class: 'nowrap'}, matrixCell(row, key)))));
    if (row.note) body.append(el('tr', {class: `dsnote${chosen ? ' sel' : ''}`}, el('td', {}), el('td', {colspan: head.length - 1}, row.note + '.')));
  }
  return card(el('h2', {}, 'Datasets and checks'),
    el('p', {class: 'note'}, 'Each cell gives the runs flagged out of the runs the check could judge (plays for Repetitions; for Coverage, the runs that could not be checked in full). "n/a" means that the check cannot run in that dataset: hover or focus it for the reason. Click a cell to open that check for that dataset.'),
    el('div', {class: 'scroll'}, el('table', {}, el('thead', {}, el('tr', {}, head.map(label => el('th', {}, label)))), body)));
}
function openFinding(finding) {
  const key = `${finding.dataset}|${finding.run}`, tab = TAB_OF_CHECK[finding.check];
  go(Object.assign({tab}, tab === 'reps' ? {play: key} : {run: key}));
  $('#tabs').scrollIntoView();
}
function findingsCard() {
  const tableHost = el('div'), countHost = el('span', {class: 'note'});
  const menu = (id, label, options) => el('span', {class: 'field'}, el('label', {for: `filter-${id}`}, label),
    el('select', {id: `filter-${id}`, onchange: event => { ui.filter[id] = event.target.value; draw(); }},
       options.map(([value, text]) => el('option', {value, selected: ui.filter[id] === value}, text))));
  function draw() {
    const rows = DATA.findings.filter(row => (!state.ds || row.dataset === state.ds)
      && (!ui.filter.check || row.check === ui.filter.check) && (!ui.filter.status || row.status === ui.filter.status));
    countHost.textContent = plural(rows.length, 'finding');
    tableHost.replaceChildren();
    dataTable(tableHost, {id: 'findings', rows, onPick: openFinding, empty: 'No finding matches.', columns: [
      {label: '', title: 'Status: new or documented', value: statusRank, show: statusIcon},
      {label: 'Dataset', value: row => row.dataset}, {label: 'Run or play', value: row => row.run, cls: 'nowrap'},
      {label: 'Check', value: row => row.check, cls: 'nowrap'}, {label: 'Finding', value: row => row.flag},
      {label: 'Detail', value: row => row.detail || ''}, {label: 'Likely at fault', value: row => row.where || ''},
      {label: 'Documented as', value: row => row.known || '', show: row => knownNote(row.known, row.url)},
      {label: 'Events file', value: row => (row.events || '').split('/').pop(), cls: 'mono nowrap'}]});
  }
  draw();
  return card(el('h2', {}, 'Flagged runs'),
    el('p', {class: 'note'}, 'Every run a check flagged, with the predictors that see the problem and the file it points at. Click a row to open the run in its check.'),
    el('div', {class: 'controls'}, menu('check', 'Check', [['', 'All checks']].concat(Object.keys(TAB_OF_CHECK).map(name => [name, name]))),
       menu('status', 'Status', [['', 'New and documented'], ['new', 'New, to check'], ['documented', 'Documented']]), countHost),
    statusKey(), tableHost);
}

/* ---- 15. Coverage ------------------------------------------------------------------------ */
function renderCoverage(host) {
  view = newView('run');
  host.append(card(el('h2', {}, 'Methods'), fromTemplate('m-coverage')));
  const rows = DATA.overview.filter(row => !state.ds || row.dataset === state.ds);
  const missing = DATA.coverage.filter(row => !state.ds || row.ds === state.ds);
  const total = key => rows.reduce((sum, row) => sum + (row[key] || 0), 0);
  const unreliable = rows.filter(row => !row.predictors).map(row => row.dataset);
  host.append(resultsCard(
    el('p', {}, `Of ${plural(total('runs'), 'run')}, `, el('b', {}, count(total('coverage'))), ` could not be checked in full, and ${count(total('runs') - total('with_series'))} have no parcel time series.`),
    unreliable.length > 0 && el('p', {}, `No predictor is reliable in ${unreliable.join(', ')}: the brain checks cannot run there.`)));

  const reasons = new Map();
  for (const row of missing) {
    if (!reasons.has(row.ds)) reasons.set(row.ds, new Map());
    reasons.get(row.ds).set(row.coverage, (reasons.get(row.ds).get(row.coverage) || 0) + 1);
  }
  const perDataset = rows.map(row => [row.dataset, count(row.runs), count(row.with_series), count(row.coverage),
    el('div', {}, [...(reasons.get(row.dataset) || [])].sort((a, b) => b[1] - a[1]).map(([text, n]) => el('div', {}, `${plural(n, 'run')}: ${text}`))),
    ['shift', 'pair', 'end', 'drift', 'reps'].filter(key => whyNot(key, row.dataset) && (key !== 'reps' || isGame(row.dataset))).map(key => el('div', {}, `${CHECKS[key].label}: ${whyNot(key, row.dataset)}`)),
    row.note || '']);
  host.append(card(el('h2', {}, 'What could not be checked, per dataset'),
    simpleTable([{label: 'Dataset'}, {label: 'Runs', num: true}, {label: 'With time series', num: true}, {label: 'Not checked in full', num: true},
                 {label: 'Why, by run'}, {label: 'Checks that cannot run'}, {label: 'Note'}], perDataset)));

  const tableHost = el('div');
  const columns = [{label: 'Run', value: row => row.id, cls: 'nowrap'}, {label: 'Task', value: row => row.task}, {label: 'What is missing', value: row => row.coverage}];
  if (!state.ds) columns.unshift({label: 'Dataset', value: row => row.ds});
  dataTable(tableHost, {id: 'coverage', rows: missing, columns, empty: 'Every run of this selection could be checked.'});
  host.append(card(el('h2', {}, 'Runs'), tableHost));
}

/* ---- 16. Page: controls, tabs, rendering ---------------------------------------------------- */
const RENDER = {overview: renderOverview, shift: renderShift, pair: renderPair, end: renderEnd, drift: renderDrift,
                reps: renderReps, coverage: renderCoverage};

function buildControls() {
  $('#lede').textContent = `Timing checks between each BOLD run and its events file, read from the brain signal, for every Courtois NeuroMod dataset with parcel time series: ${count(DATA.overview.reduce((sum, row) => sum + row.runs, 0))} runs in ${DATASETS.length} datasets. Each tab explains one check, shows every run, and lists the runs that need a look.`;
  $('#ds-menu').append(el('option', {value: ''}, 'All datasets'),
    ...DATA.overview.map(row => el('option', {value: row.dataset}, `${row.dataset} (${count(row.runs)} runs)`)));
  $('#ds-menu').addEventListener('change', event => go({ds: event.target.value}));
  for (const button of document.querySelectorAll('[data-colour]')) button.addEventListener('click', () => go({colour: button.dataset.colour}));
  const tabs = $('#tabs');
  TABS.forEach(([key, label]) => tabs.append(el('button', {type: 'button', role: 'tab', id: `tab-${key}`, 'aria-controls': 'view', 'data-tab': key,
    onclick: () => go({tab: key})}, label)));
  tabs.addEventListener('keydown', event => {
    const step = {ArrowRight: 1, ArrowLeft: -1}[event.key];
    if (!step) return;
    const index = TABS.findIndex(tab => tab[0] === state.tab), next = TABS[(index + step + TABS.length) % TABS.length][0];
    go({tab: next});
    $(`#tab-${next}`).focus();
  });
}
function syncControls() {
  $('#ds-menu').value = state.ds;
  for (const button of document.querySelectorAll('[data-colour]')) button.setAttribute('aria-pressed', String(button.dataset.colour === state.colour));
  for (const tab of $('#tabs').children) {
    const active = tab.dataset.tab === state.tab;
    setAttrs(tab, {'aria-selected': String(active), tabindex: active ? 0 : -1});
  }
}
/** Draws the visible tab only; the other tabs cost nothing until they are opened. */
function render() {
  hideTip();
  syncControls();
  const host = $('#view');
  host.replaceChildren();
  host.setAttribute('aria-labelledby', `tab-${state.tab}`);
  RENDER[state.tab](host);
  view.draws.forEach(draw => draw());
  writeHash();
}

let resizeTimer = null, lastWidth = innerWidth;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (innerWidth === lastWidth || !view) return;
    lastWidth = innerWidth;
    view.draws.forEach(draw => draw());
  }, 150);
});
window.addEventListener('hashchange', () => {
  if (location.hash === lastHash) return;
  readHash();
  render();
});

buildControls();
readHash();
render();
</script>
</body>
</html>
